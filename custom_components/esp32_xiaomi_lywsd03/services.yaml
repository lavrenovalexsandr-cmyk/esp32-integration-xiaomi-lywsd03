add_sensor:
  name: Add Xiaomi sensor
  description: Save a Xiaomi LYWSD03MMC sensor on one ESP32 gateway.
  fields:
    device_id:
      name: Gateway device ID
      description: Stable 12-character ESP32 gateway ID from MQTT identity.
      required: true
      example: "A1B2C3D4E5F6"
      selector:
        text:
    mac:
      name: Sensor MAC
      description: MAC address in canonical format.
      required: true
      example: "A4:C1:38:12:34:56"
      selector:
        text:
    bind_key:
      name: Bind key
      description: 32 hexadecimal characters. It is sent only in the add command and is not stored.
      required: true
      selector:
        text:
          type: password

remove_sensor:
  name: Remove Xiaomi sensor
  description: Remove a saved Xiaomi sensor from one ESP32 gateway.
  fields:
    device_id:
      name: Gateway device ID
      description: Stable 12-character ESP32 gateway ID from MQTT identity.
      required: true
      example: "A1B2C3D4E5F6"
      selector:
        text:
    mac:
      name: Sensor MAC
      description: MAC address in canonical format.
      required: true
      example: "A4:C1:38:12:34:56"
      selector:
        text:
